<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>How to make Chicken Tikka Masala</title>
    <style>
        :root {
            --bg: #0f0b08;
            --panel: #1a1410;
            --accent: #ff7b00;
            --accent-glow: rgba(255, 123, 0, 0.35);
            --text: #fef3c7;
            --border: #2d241d;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
        .browser-container { display: flex; flex-direction: column; height: 100vh; }

        .tabs-container { display: flex; align-items: flex-end; gap: 2px; background: #000; padding: 6px 10px 0 10px; border-bottom: 1px solid var(--border); }
        .tab {
            padding: 8px 20px; background: var(--panel); border: 1px solid var(--border); border-bottom: none;
            border-radius: 8px 8px 0 0; cursor: pointer; font-size: 12px; color: #a16207;
            display: flex; align-items: center; gap: 12px; min-width: 120px; transition: 0.2s;
        }
        .tab.active { background: var(--bg); color: var(--accent); border-top: 2px solid var(--accent); box-shadow: 0 -5px 15px var(--accent-glow); }
        .tab-close { font-size: 16px; opacity: 0.5; }
        .tab-close:hover { color: #ef4444; opacity: 1; }
        .add-tab { cursor: pointer; padding: 8px 15px; color: var(--accent); font-size: 22px; }

        .top-bar { background: var(--bg); padding: 10px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border); }
        .address-bar { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; flex: 1; color: #fbbf24; outline: none; font-family: monospace; }
        .address-bar:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        .btn-cook { background: var(--accent); color: #000; border: none; padding: 10px 28px; border-radius: 8px; cursor: pointer; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        .btn-cook:hover { filter: brightness(1.2); }

        .content-area { flex: 1; position: relative; background: #000; }
        .viewport { width: 100%; height: 100%; border: none; display: none; background: white; }
        .viewport.active { display: block; }

        #home-page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at center, #1a1410 0%, #0d0d0f 100%); z-index: 5; }
        .home-title { font-size: 2.5rem; font-weight: 900; color: #2d241d; text-transform: uppercase; border: 2px solid #2d241d; padding: 20px 40px; border-radius: 12px; }
    </style>
</head>
<body>

<div class="browser-container">
    <div class="tabs-container" id="tabs-list">
        <div class="add-tab" onclick="createNewTab()">+</div>
    </div>
    <div class="top-bar">
        <input type="text" class="address-bar" id="url-input" spellcheck="false" autocomplete="off">
        <button class="btn-cook" onclick="loadUrl()">Cook</button>
    </div>
    <div class="content-area" id="viewports">
        <div id="home-page">
            <div class="home-title">Chicken Tikka Masala</div>
        </div>
    </div>
</div>

<script>
    const gate = 'https://script.google.com/macros/s/AKfycbwbL6CKA8NYA6gu6GBK0gvN50oEf42jyQTSK4yZwlpT2KPbMGdP2VKJNcswp_cmc51x/exec';
    let tabs = [];
    let activeTabId = null;

    function createNewTab() {
        const id = 't-' + Date.now();
        tabs.push({ id: id, url: '' });
        const tabEl = document.createElement('div');
        tabEl.className = 'tab';
        tabEl.id = 'label-' + id;
        tabEl.innerHTML = `New Tab <span class="tab-close" onclick="closeTab('${id}', event)">×</span>`;
        tabEl.onclick = () => switchTab(id);
        document.getElementById('tabs-list').insertBefore(tabEl, document.querySelector('.add-tab'));
        const ifr = document.createElement('iframe');
        ifr.className = 'viewport';
        ifr.id = 'frame-' + id;
        document.getElementById('viewports').appendChild(ifr);
        switchTab(id);
    }

    function switchTab(id) {
        activeTabId = id;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.viewport').forEach(v => v.classList.remove('active'));
        document.getElementById('label-' + id).classList.add('active');
        document.getElementById('frame-' + id).classList.add('active');
        const frame = document.getElementById('frame-' + id);
        document.getElementById('home-page').style.display = frame.src ? 'none' : 'flex';
        const tabData = tabs.find(t => t.id === id);
        document.getElementById('url-input').value = tabData.url;
    }

    function loadUrl() {
        let input = document.getElementById('url-input').value.trim();
        if (!input || !activeTabId) return;
        let finalUrl;
        const urlPattern = /^(https?:\/\/)?([\w\d-]+\.)+\w{2,}(\/.*)?$/i;
        if (urlPattern.test(input)) {
            if (!input.startsWith('http')) input = 'https://' + input;
            finalUrl = input;
        } else {
            finalUrl = 'https://duckduckgo.com/html/?q=' + encodeURIComponent(input);
        }
        
        const tabData = tabs.find(t => t.id === activeTabId);
        tabData.url = input;
        const frame = document.getElementById('frame-' + activeTabId);
        
        // This is the key change: 
        // We set the frame source and attempt to force the base target
        frame.src = gate + "?url=" + encodeURIComponent(finalUrl);
        
        document.getElementById('label-' + activeTabId).innerHTML = `Loading... <span class="tab-close" onclick="closeTab('${activeTabId}', event)">×</span>`;
        document.getElementById('home-page').style.display = 'none';

        // Listen for the load to try and strip target="_blank"
        frame.onload = function() {
            try {
                const innerDoc = frame.contentDocument || frame.contentWindow.document;
                const links = innerDoc.getElementsByTagName('a');
                for (let link of links) {
                    link.target = '_self'; // Forces links to open in the same iframe
                }
            } catch (e) {
                console.warn("Cross-origin security blocked link re-writing. This is normal for many proxies.");
            }
        };
    }

    function closeTab(id, e) {
        e.stopPropagation();
        tabs = tabs.filter(t => t.id !== id);
        document.getElementById('label-' + id).remove();
        document.getElementById('frame-' + id).remove();
        if (activeTabId === id && tabs.length > 0) switchTab(tabs.id);
        if (tabs.length === 0) createNewTab();
    }

    document.getElementById('url-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') loadUrl(); });
    createNewTab();
</script>
</body>
</html>
